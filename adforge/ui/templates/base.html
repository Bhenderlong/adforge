<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AdForge{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav class="nav">
  <a class="brand" href="/">Ad<span>Forge</span></a>
  <a href="/" class="{{ 'on' if request.url.path == '/' }}">Dashboard</a>
  <a href="/queue" class="{{ 'on' if request.url.path.startswith('/queue') or request.url.path.startswith('/post') }}">Queue</a>
  <a href="/compose" class="{{ 'on' if request.url.path == '/compose' }}">Compose</a>
  <a href="/schedules" class="{{ 'on' if request.url.path.startswith('/schedules') }}">Schedules</a>
  <a href="/radar" class="{{ 'on' if request.url.path.startswith('/radar') }}">Radar</a>
  <a href="/accounts" class="{{ 'on' if request.url.path.startswith('/accounts') }}">Accounts</a>
  <a href="/brands" class="{{ 'on' if request.url.path.startswith('/brands') }}">Brands</a>
  <a href="/settings" class="{{ 'on' if request.url.path.startswith('/settings') }}">Settings</a>
  <span class="spacer"></span>
  {% if settings.dry_run %}
    <span class="pill warn" title="Global dry run is ON. Nothing is transmitted to any platform.">DRY RUN</span>
  {% else %}
    <span class="pill live" title="Global dry run is OFF. Enabled accounts will publish for real.">LIVE</span>
  {% endif %}
  <span id="gpu-pill" class="pill muted">GPU —</span>
</nav>

<main>
<div id="jobresult" class="note hidden"><p id="jobresulttext"></p></div>
{% block body %}{% endblock %}
</main>

<div id="jobbar" class="jobbar hidden">
  <span id="jobrunning" class="hidden"><strong>Running</strong>
    <span id="joblist"></span></span>
  <span id="jobfailed" class="hidden"><strong class="txt-bad">Failed</strong>
    <span id="faillist"></span>
    <button class="sm" onclick="clearJobs()">Dismiss</button></span>
</div>

<script>
// Poll status so the GPU pill and the running-jobs bar stay honest without a
// full page reload. Generation can take minutes; the user needs to see that
// something is actually happening.
async function poll() {
  try {
    const r = await fetch('/api/status');
    if (!r.ok) return;
    const d = await r.json();
    const pill = document.getElementById('gpu-pill');
    if (d.vram && d.vram.length) {
      const used = d.vram.map(g => g.pct + '%').join(' / ');
      pill.textContent = 'GPU ' + used + (d.gpu_mode ? ' · ' + d.gpu_mode : '');
      pill.className = 'pill ' + (d.vram.some(g => g.pct > 90) ? 'warn' : 'muted');
    }
    const jobs = d.jobs || [];
    const running = jobs.filter(j => j.state === 'running');
    // Failures were previously filtered out along with everything non-running,
    // so a generation that threw looked exactly like one that finished: the
    // bar simply disappeared. The error only existed in the log.
    const failed = jobs.filter(j => j.state === 'failed');
    const bar = document.getElementById('jobbar');
    const runSpan = document.getElementById('jobrunning');
    const failSpan = document.getElementById('jobfailed');

    document.getElementById('joblist').textContent =
      running.map(j => j.name).join(', ');
    runSpan.classList.toggle('hidden', !running.length);

    document.getElementById('faillist').textContent = failed
      .map(j => j.name + (j.detail ? ' — ' + j.detail : '')).join('; ');
    failSpan.classList.toggle('hidden', !failed.length);

    bar.classList.toggle('hidden', !running.length && !failed.length);
  } catch (e) { /* transient; next tick retries */ }
}
poll();
setInterval(poll, 4000);

// Drops only finished and failed records; running and queued jobs survive.
async function clearJobs() {
  await fetch('/api/jobs/clear', { method: 'POST' });
  poll();
}

// Report the outcome of a job we were redirected here to watch.
//
// Every button that dispatches work redirects with ?job=<id>. The work runs on
// the pool, so the outcome cannot be in the response - which is why these
// buttons used to return a byte-identical page whether they had done something
// or nothing at all. This watches the one job we were sent to watch and says
// what happened, on whichever page the redirect landed on.
async function watchJob() {
  const id = new URLSearchParams(location.search).get('job');
  if (!id) return;
  const box = document.getElementById('jobresult');
  const txt = document.getElementById('jobresulttext');
  box.classList.remove('hidden');
  for (let i = 0; i < 900; i++) {          // ~30 min ceiling; a Wan render is slow
    let job;
    try {
      const r = await fetch('/api/jobs');
      job = (await r.json()).find(j => j.id === id);
    } catch (e) { /* transient */ }
    if (!job) { txt.textContent = 'That job is no longer being tracked.'; return; }
    if (job.state === 'done') {
      box.className = 'note';
      txt.innerHTML = '<strong>' + job.name + '</strong> — ' +
                      (job.detail || 'finished');
      return;
    }
    if (job.state === 'failed') {
      box.className = 'note bad';
      txt.innerHTML = '<strong>' + job.name + ' failed</strong> — ' +
                      (job.detail || 'no detail recorded');
      return;
    }
    txt.textContent = job.name + ' is ' + job.state + '…';
    await new Promise(r => setTimeout(r, 2000));
  }
}
watchJob();

// Character counters for any textarea declaring a limit.
document.querySelectorAll('textarea[data-limit]').forEach(function (ta) {
  const limit = parseInt(ta.dataset.limit, 10);
  const out = document.querySelector(ta.dataset.counter);
  if (!out) return;
  const upd = () => {
    const n = ta.value.length;
    out.textContent = n + ' / ' + limit;
    out.className = 'counter' + (n > limit ? ' over' : (n > limit * 0.9 ? ' near' : ''));
  };
  ta.addEventListener('input', upd);
  upd();
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
